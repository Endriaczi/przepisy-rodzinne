<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f5f0">
    <title>Przepisy rodzinne</title>
    <link rel="stylesheet" href="style.css?v=20261122-turkus">
  </head>
  <body>
    <main class="app">
      <section id="login-screen" class="screen login-screen">
        <div class="login-card">
          <p class="eyebrow">Przepisy rodzinne</p>
          <h1>Witaj</h1>
          <p>Zaloguj się swoim kontem Google, aby korzystać z prywatnej bazy przepisów.</p>
          <button id="login-button" class="primary">Zaloguj przez Google</button>
          <p id="login-message" class="message" aria-live="polite"></p>
        </div>
      </section>

      <section id="people-screen" class="screen people-screen hidden" aria-label="Wybór osoby">
        <header class="account"><span id="account-name"></span><button id="logout-button">Wyloguj</button></header>
        <button class="person-card" data-person="emilka" aria-label="Wybierz Emilkę">
          <span id="portrait-emilka" class="portrait">Zdjęcie Emilki<br>dodamy po zabezpieczeniu plików</span>
        </button>
        <button class="person-card" data-person="kasia" aria-label="Wybierz Kasię">
          <span id="portrait-kasia" class="portrait">Zdjęcie Kasi<br>dodamy po zabezpieczeniu plików</span>
        </button>
        <section id="portrait-admin" class="portrait-admin" hidden aria-label="Zdjęcia administracyjne">
          <p>Zdjęcia administratora</p>
          <label class="secondary" for="upload-emilka">Zmień zdjęcie Emilki</label>
          <input id="upload-emilka" data-portrait-upload="emilka" type="file" accept="image/png,image/jpeg" hidden>
          <label class="secondary" for="upload-kasia">Zmień zdjęcie Kasi</label>
          <input id="upload-kasia" data-portrait-upload="kasia" type="file" accept="image/png,image/jpeg" hidden>
          <button id="seed-recipes" class="secondary" type="button">Uzupełnij bazę przepisów</button>
          <button id="import-histamine" class="secondary" type="button">Importuj bazę Histamina</button>
          <p id="portrait-message" class="message" aria-live="polite"></p>
        </section>
      </section>

      <section id="search-screen" class="screen hidden" aria-labelledby="search-title">
        <header class="topbar"><button class="back" data-back="people" aria-label="Wróć">←</button><h1 id="search-title"></h1></header>
        <p class="screen-label">Wybierz posiłek</p>
        <div class="categories" role="group" aria-label="Kategoria posiłku">
          <button class="category" data-category="sniadanie">Śniadanie</button>
          <button class="category" data-category="obiad">Obiad</button>
          <button class="category" data-category="kolacja_przekaska">Kolacja / Przekąska</button>
        </div>
        <label class="ingredient-label" for="ingredient">Główny składnik</label>
        <input id="ingredient" type="search" autocomplete="off" placeholder="np. kurczak, ryż, batat">
        <button id="show-results" class="primary" disabled>Pokaż przepisy</button>
      </section>

      <section id="results-screen" class="screen hidden" aria-labelledby="results-title">
        <header class="topbar"><button class="back" data-back="search" aria-label="Wróć">←</button><h1 id="results-title">Przepisy</h1></header>
        <p id="result-summary" class="message"></p>
        <div id="recipe-list" class="empty" aria-live="polite"></div>
      </section>
    </main>
    <dialog id="review-dialog" class="review-dialog" aria-labelledby="review-dialog-title">
      <article>
        <h2 id="review-dialog-title">Co wymaga sprawdzenia?</h2>
        <p id="review-dialog-reasons"></p>
        <p class="recipe-note">To nie jest automatyczne wykluczenie. Po sprawdzeniu możesz wrócić do listy i wybrać „Dopuść” albo „Wyklucz”.</p>
        <button id="review-dialog-close" class="primary" type="button">Rozumiem</button>
      </article>
    </dialog>
    <script type="module" src="app.js?v=20261122-search-and-review"></script>
  </body>
</html>
