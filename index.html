<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f5f0">
    <title>Przepisy rodzinne</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app" id="app">
      <section class="screen screen--people" id="people-screen" aria-label="Wybór osoby">
        <button class="person-card person-card--emilka" data-person="emilka" aria-label="Wybierz Emilkę">
          <span class="portrait" aria-hidden="true">Zdjęcie Emilki<br>dodamy później</span>
          <span class="person-name">Emilka</span>
        </button>
        <button class="person-card person-card--kasia" data-person="kasia" aria-label="Wybierz Kasię">
          <span class="portrait" aria-hidden="true">Zdjęcie Kasi<br>dodamy później</span>
          <span class="person-name">Kasia</span>
        </button>
      </section>

      <section class="screen hidden" id="search-screen" aria-labelledby="search-title">
        <header class="topbar"><button class="back" data-back="people" aria-label="Wróć">←</button><h1 id="search-title"></h1></header>
        <p class="screen-label">Wybierz posiłek</p>
        <div class="categories" role="group" aria-label="Kategoria posiłku">
          <button class="category" data-category="sniadanie">Śniadanie</button>
          <button class="category" data-category="obiad">Obiad</button>
          <button class="category" data-category="kolacja_przekaska">Kolacja / Przekąska</button>
        </div>
        <label class="ingredient-label" for="ingredient">Główny składnik</label>
        <input id="ingredient" type="search" autocomplete="off" placeholder="np. kurczak, ryż, batat">
        <button class="show-results" id="show-results" disabled>Pokaż przepisy</button>
        <p class="helper">Wyniki pojawią się po wybraniu kategorii.</p>
      </section>

      <section class="screen hidden" id="results-screen" aria-labelledby="results-title">
        <header class="topbar"><button class="back" data-back="search" aria-label="Wróć">←</button><h1 id="results-title">Przepisy</h1></header>
        <p class="result-summary" id="result-summary"></p>
        <div class="recipe-list" id="recipe-list"></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
